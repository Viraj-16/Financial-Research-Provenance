[project]
name = "frp"
version = "0.1.0"
description = "Financial Research Provenance — a reproducibility and provenance layer for quantitative research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "FRP" }]
keywords = ["quant", "reproducibility", "provenance", "backtest", "finance"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
frpx = "frp.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer uses function-call defaults

[tool.ruff.lint.per-file-ignores]
# The dashboard server embeds an HTML/CSS/JS template as a string literal;
# long lines there are inherent to the markup and not Python style issues.
"frp/dashboard/server.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"